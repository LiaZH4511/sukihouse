<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAF 批量转换器</title>
    <meta name="description" content="本地批量 RAF 到 JPEG、PNG、SVG 转换工具">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="utility-nav" aria-label="工具分类">
      <span>RAW 转换</span>
      <span>照片压缩</span>
      <span>批量处理</span>
      <span>X 媒体下载</span>
      <span>本地安全</span>
    </header>

    <nav class="site-nav" aria-label="主导航">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>Raflio</span>
      </a>
      <div class="nav-links">
        <span>转换</span>
        <span>JPEG</span>
        <span>PNG</span>
        <span>SVG</span>
        <span>X 媒体</span>
        <span>Help</span>
      </div>
      <div class="nav-actions">
        <span>我的文件 <strong id="fileCount">0</strong></span>
        <div class="status-pill" id="statusPill">待选择</div>
      </div>
    </nav>

    <main class="app">
      <section class="workspace" aria-label="转换工作台">
        <form id="uploadForm" class="dropzone" aria-label="选择 RAF 文件">
          <input id="fileInput" name="files" type="file" accept=".raf,.RAF" multiple>
          <ul id="fileList" class="file-list"></ul>
        </form>

        <div class="format-row">
          <span>将所有转换为</span>
          <div class="format-options" aria-label="选择输出格式">
            <button class="format-option active" type="button" data-format="jpeg">JPEG</button>
            <button class="format-option" type="button" data-format="png">PNG</button>
            <button class="format-option" type="button" data-format="svg">SVG</button>
          </div>
        </div>

        <div class="toolbar" aria-label="转换操作">
          <button id="addButton" class="add-button" type="button">
            <span aria-hidden="true">+</span>
            添加更多文件
          </button>
          <p class="hint">使用 Ctrl 或 Shift 一次添加多个文件</p>
          <button id="clearButton" class="ghost-button" type="button" disabled>清空</button>
          <div class="spacer"></div>
          <button id="convertButton" class="convert-button" type="button" disabled>
            转换
            <span aria-hidden="true">-></span>
          </button>
        </div>

        <div class="download-row">
          <span id="downloadHint">转换完成后会生成一个 JPEG 压缩包</span>
          <a id="downloadButton" class="download disabled" href="#" aria-disabled="true">下载 JPEG</a>
        </div>
      </section>

      <section class="x-workspace" aria-labelledby="xTitle">
        <div>
          <h2 id="xTitle">X 媒体下载</h2>
          <p>粘贴公开 X/Twitter 推文链接，下载其中的视频或 GIF 媒体。</p>
        </div>

        <div class="x-controls">
          <input id="xUrlInput" type="url" placeholder="https://x.com/user/status/..." aria-label="X 推文链接">
          <div class="x-type-options" aria-label="选择 X 媒体类型">
            <button class="x-type-option active" type="button" data-type="video">视频</button>
            <button class="x-type-option" type="button" data-type="gif">GIF</button>
          </div>
          <button id="xDownloadButton" class="x-download-button" type="button">下载</button>
        </div>

        <div class="x-result" aria-live="polite">
          <span id="xStatus">仅支持你有权保存的公开内容。</span>
          <a id="xFileButton" class="download disabled" href="#" aria-disabled="true">下载文件</a>
        </div>
      </section>

      <section class="features" aria-label="快捷操作">
        <button id="featurePickButton" class="feature-card" type="button">
          <span aria-hidden="true">RAF</span>
          <strong>选择 RAF</strong>
        </button>
        <button id="featureZipButton" class="feature-card" type="button">
          <span aria-hidden="true">ZIP</span>
          <strong>下载 ZIP</strong>
        </button>
        <button id="featureLocalButton" class="feature-card" type="button" aria-expanded="false">
          <span aria-hidden="true">MAC</span>
          <strong>本地处理</strong>
        </button>
        <p id="localInfo" class="local-info" hidden>所有 RAF 转换都在本机服务中处理；X 媒体下载只支持你有权保存的公开链接。</p>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
